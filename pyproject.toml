[project]
name = "career-builder-ai"
version = "1.0.0"
description = "AI-powered career guidance chatbot"
authors = [
    {name = "Dikshant Dave", email = "davedikshant007@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit~=1.51.0",
    "langchain~=1.0.3",
    "langchain-community~=0.4.1",
    "openai~=2.6.1",
    "pinecone-client~=6.0.0",
    "python-dotenv~=1.2.1",
    "requests~=2.32.5",
    "beautifulsoup4~=4.14.2",
    "newspaper3k~=0.2.8",
    "pydantic~=2.12.3",
    "tiktoken~=0.12.0",
    "langchain-core~=1.0.2",
    "langchain-text-splitters~=1.0.0",
    "langsmith~=0.4.39",
    "aiohttp~=3.13.2",
    "httpx~=0.28.1",
    "httpcore~=1.0.9",
    "pandas~=2.3.3",
    "numpy~=2.3.4",
    "nltk~=3.9.2",
    "certifi~=2025.10.5",
    "charset-normalizer~=3.4.4",
    "idna~=3.11",
    "urllib3~=2.5.0",
]

[project.optional-dependencies]
dev = [
    "black~=25.9.0",
    "isort~=7.0.0",
    "flake8~=7.3.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | uploads
  | pdfs_to_process
  | logs
  | templates
  | data
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
no_lines_before = ["LOCALFOLDER"]
force_sort_within_sections = true
force_alphabetical_sort_within_sections = true
lines_after_imports = 2
combine_as_imports = true

[tool.flake8]
max-line-length = 88
extend-ignore = "E203,W503,E501"
exclude = ".git,__pycache__,build,dist,.venv,venv,uploads,logs,templates,data"
per-file-ignores = [
    "__init__.py:F401",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# For setuptools (if building as package)
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "docs*", "scripts*", "uploads*", "logs*", "templates*", "data*"]